<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Barkly's Instagram</title>
  <style>
    @font-face {
      font-family: "Fraunces";
      font-style: italic;
      font-weight: 500;
      src: url("/fonts/fraunces-italic-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 500;
      src: url("/fonts/fraunces-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Outfit";
      font-style: normal;
      font-weight: 400 600;
      src: url("/fonts/outfit.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #1a3a4c; }
    [data-document-role="page"] {
      width: 1080px;
      height: 1350px;
      background: #fbf7f0;
      position: relative;
      overflow: hidden;
      padding: 56px 64px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .logo { width: 108px; height: auto; margin-bottom: 22px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 46px;
      font-weight: 500;
      color: #1a3a4c;
      text-align: center;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 28px;
      text-wrap: balance;
    }
    .polaroid {
      background: #fff;
      border-radius: 28px;
      padding: 16px 16px 22px;
      box-shadow: 0 18px 40px color-mix(in oklab, #2c5a71 12%, transparent);
      transform: rotate(-1.6deg);
      position: relative;
      width: 820px;
    }
    .tape {
      position: absolute;
      top: -12px;
      left: 50%;
      width: 86px;
      height: 26px;
      background: #f5b0cb;
      transform: translateX(-50%) rotate(-4deg);
      opacity: 0.85;
      border-radius: 2px;
    }
    .polaroid img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center 18%;
      border-radius: 18px;
      display: block;
    }
    .polaroid figcaption {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      text-align: center;
      color: #2c5a71;
      font-size: 22px;
      margin-top: 12px;
    }
    .cta {
      margin-top: auto;
      text-align: center;
      font-family: "Outfit", sans-serif;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3d8296;
    }
  </style>
</head>
<body>
  <section data-document-role="page" data-label="Instagram">
    <img class="logo" src="/logo.png" alt="Barkly's" />
    <h1>Fear-Free grooming at home</h1>
    <figure class="polaroid">
      <span class="tape"></span>
      <img src="/shoot/vanessa-portrait.jpg" alt="Vanessa and Bubbles" />
      <figcaption>Vanessa and Bubbles</figcaption>
    </figure>
    <p class="cta">Book at barklysclt.com</p>
  </section>
</body>
</html>
